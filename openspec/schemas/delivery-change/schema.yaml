name: delivery-change
version: 6
description: 面向真实交付的提案、决策、实现审查、验收、先归档后PR九层工作流

artifacts:
  - id: raw-requirements
    generates: 01-原始需求/原始需求索引.md
    description: 不改写原意的需求原始材料索引
    template: raw-requirements.md
    instruction: |
      建立本次 change 的原始需求资产索引。
      记录来源、时间、原始位置、介质、完整性和关联材料；原始附件可以放在同目录 attachments/。
      材料索引表的 RAW 编号顺序即来源权威顺序：RAW-001 权威最高，编号越大权威越低。
      冲突时以编号更小的来源为准，因此录入时就要按权威从高到低编号，不要按拿到材料的先后编号。
      不要把归一化解释写成原文，也不要静默修正冲突。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 归一化、可验收并可归档的正式需求增量
    template: spec.md
    instruction: |
      基于原始材料形成正式需求增量，定义 WHAT 和 WHY，不写实现步骤。
      每个 capability 使用 OpenSpec 标准路径 specs/<capability>/spec.md；
      02-需求理解/specs 是指向该目录的单一真源入口，不复制文件。
      新能力使用 ## Purpose 和 ## ADDED Requirements；修改能力使用 ## MODIFIED Requirements；
      删除和重命名分别使用 ## REMOVED Requirements、## RENAMED Requirements。
      Requirement 使用 SHALL/MUST；每项 Requirement 至少包含一个四级标题 Scenario，使用 WHEN/THEN。
      02-需求理解/需求理解.md 可记录术语、范围、非范围、澄清结论、冲突和待确认事项；
      只有 specs/**/*.md 参与长期需求同步。
    requires:
      - raw-requirements

  - id: current-state
    generates: 03-现状/现状.md
    description: 改造前的业务与技术现状（v6 起合并为一份）
    template: current-state.md
    instruction: |
      描述改造前业务如何运行，以及它当前由什么技术实现。
      业务面覆盖角色、触发、业务对象、状态、主路径、失败分支和上下游责任；
      技术面引用实际仓库、分支、模块、类、接口、数据、事务、缓存、通知、部署和运行态证据。
      使用 Mermaid 分别表达关键业务时序与技术流程。先锁定入口和关键边界，细节随调查补充。
      区分源码事实、运行态事实和推断；不得把目标方案写成当前事实。
    requires:
      - raw-requirements
      - specs

  - id: solution-proposal
    generates: 05-改造方案/方案提案.md
    description: 候选方案、约束、Trade-off、推荐和未决问题
    template: solution-proposal.md
    instruction: |
      至少提出两个真实候选，记录约束、优缺点、成本、风险、可逆性和结构化 Trade-off。
      可以给出推荐，但不得把推荐写成最终决策；保留需要维护者决定的未决问题。
    requires:
      - specs
      - current-state

  - id: solution-decision
    generates: 05-改造方案/方案决策.md
    description: 维护者对提案候选作出的权威选择
    template: solution-decision.md
    instruction: |
      只有维护者明确选择后才能记录 APPROVED。保存选择、决策人、时间、依据、拒绝方案、
      接受的后果和重新决策触发条件；不得由提案作者自动代替维护者决定。
    requires:
      - solution-proposal

  - id: change-plan
    generates: 05-改造方案/改造方案.md
    description: 将已批准决策转化为目标状态、实施切片、迁移和回滚计划
    template: change-plan.md
    instruction: |
      只实现方案决策中已批准的候选。覆盖目标/非目标、目标流程、影响面、仓库切片、
      兼容策略、迁移顺序、风险和回滚；不得重新引入已拒绝方案或在本文件替代决策。
    requires:
      - solution-decision

  - id: test-plan
    generates: 06-测试方案/测试方案.md
    description: 实现前的测试策略、场景、fixture、断言、运行配置和清理计划
    template: test-plan.md
    instruction: |
      设计如何证明 Requirement 和改造正确。覆盖测试层级、场景、输入、断言、失败停止条件、数据准备、运行环境和清理。
      fixtures/、scenarios/、runtime/ 和 runner/*.ts 与本文件同目录；runs/ 不属于这里。
      本层只定义验收依据，不写实际运行结论；完整本地字段按原值保存且每类资产只保留一份。
    requires:
      - change-plan

  - id: tasks
    generates: 07-实施任务/实施任务.md
    description: 基于改造计划和测试计划形成的实现任务拆分
    template: tasks.md
    instruction: |
      同时读取 05 的实施切片和 06 的验证依据，拆成可执行实现任务。
      任务的唯一状态真源是 `task-state.json`；初始化后由 runtime-entry 的 task 命令在 Change 根排他锁内原子更新，
      `07-实施任务/实施任务.md` 只从机器状态渲染，禁止从复选框反向解析状态。
      任务覆盖代码、配置、自动化测试、runner、迁移和验收前置；Review、Acceptance、Sync、Archive、PR 属于生命周期门禁，
      不得写入 `task-state.json`，否则会形成“全部任务 verified 后才能 Acceptance”的状态循环。
    requires:
      - change-plan
      - test-plan

  - id: acceptance
    generates: 08-验收/验收记录.md
    description: 实现完成后的严格验收、run-id 原始证据和结论
    template: acceptance.md
    instruction: |
      先使用 runtime-entry 的 guard acceptance 校验批准、任务投影和当前 implementation-review。
      存在任意非 verified 任务、Review 非 PASS、存在 OPEN finding 或 Review stale 时停止。
      保存实际 run 后生成验收正文，再通过 delivery-lifecycle acceptance write 生成内容寻址
      `acceptance-state.json`；正文或 Review 后续变化必须使状态 stale。
    requires:
      - test-plan
      - tasks

  - id: release
    generates: 09-发布/发布计划.md
    description: 归档前发布计划、回滚和最终PR交付准备
    template: release-plan.md
    instruction: |
      先要求当前 acceptance-state PASS，再形成发布范围、依赖、观察、停止和回滚计划。
      本文件只规划归档后创建的最终 PR，不保存尚未发生的 PR URL、合并 commit 或 release-id。
      Spec Sync、strict validation 和清理完成后，通过 delivery-lifecycle readiness write 绑定本文件摘要、
      spec 输入输出摘要、cleanup 证据和 `prStarted=false`，再执行 archive guard。
      readiness 的 attestedBy 由 acceptance-state 的 acceptedBy 派生，归档不再索取第二次人工表态。
    requires:
      - acceptance

apply:
  requires:
    - tasks
  tracks: 07-实施任务/实施任务.md
  instruction: |
    先使用 openspec/tools/runtime-entry.ts guard apply 校验批准状态和运行时锁。
    只读取 01～07 实现前产物，按已批准的 `07-实施任务/实施任务.md` 顺序实施，
    通过 runtime-entry 的 task set 在排他锁内原子更新状态，再用 task render 更新人工审阅视图。
    本操作不生成 08 验收或 09 发布资产；全部任务完成后停止，并提示调用 /opsx-continue 进入严格验收。
    遇到需求、架构或高风险环境门禁未解决时写入 blocked_external 并停止，不通过默认值掩盖问题。
